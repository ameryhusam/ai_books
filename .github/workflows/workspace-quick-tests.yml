name: Workspace Quick Tests

on:
  push:
    paths:
      - 'app/src/main/java/com/example/data/workspace/**'
      - 'app/src/main/java/com/example/data/repository/EduMiniRepository.kt'
      - 'app/src/test/java/com/example/data/workspace/**'
      - 'app/src/test/java/com/example/EduMiniCoreTest.kt'
      - '.github/workflows/workspace-quick-tests.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/src/main/java/com/example/data/workspace/**'
      - 'app/src/main/java/com/example/data/repository/EduMiniRepository.kt'
      - 'app/src/test/java/com/example/data/workspace/**'
      - 'app/src/test/java/com/example/EduMiniCoreTest.kt'
      - '.github/workflows/workspace-quick-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run focused workspace contract tests (no APK assembly)
        run: >-
          gradle :app:testDebugUnitTest
          --tests com.example.data.workspace.WorkspaceContractValidatorTest
          -PallowMissingGoogleServices=true
