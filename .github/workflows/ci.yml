name: Edu Mini CI
on:
  push:
    branches: [main, 'feat/provider-isolation-local-workspace']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore from base64 if needed
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Configure Google Services from Base64 GitHub Secret
        id: google_services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::Missing required GitHub Actions secret: GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi

          tmp_file="$(mktemp app/google-services.json.XXXXXX)"
          trap 'rm -f "$tmp_file"' EXIT

          if ! printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > "$tmp_file"; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not valid Base64."
            exit 1
          fi

          if [ ! -s "$tmp_file" ] || ! jq -e . "$tmp_file" >/dev/null; then
            echo "::error::Decoded Google Services file is empty or contains invalid JSON."
            exit 1
          fi

          expected_package="com.aistudio.edumini.qrxmzk"
          if ! jq -e --arg package "$expected_package" \
            'any(.client[]?; .client_info.android_client_info.package_name == $package)' \
            "$tmp_file" >/dev/null; then
            echo "::error::google-services.json does not contain the expected Android package name."
            exit 1
          fi

          mv "$tmp_file" app/google-services.json
          tmp_file=""
          echo "created_temp=true" >> "$GITHUB_OUTPUT"
          echo "Google Services configuration validated and installed."

      - name: Verify Google Services task
        run: gradle :app:processDebugGoogleServices

      - name: Run unit tests and build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Cleanup temporary Google Services file
        if: always() && steps.google_services.outputs.created_temp == 'true'
        run: rm -f app/google-services.json

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: edu-mini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
