name: Edu Mini CI
on:
  push:
    branches: [main, 'feat/provider-isolation-local-workspace']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore debug keystore from base64 if needed
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi
      - name: Configure Google Services from GitHub Secrets
        id: google_services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -f app/google-services.json ]; then
            echo "created_temp=false" >> "$GITHUB_OUTPUT"
            echo "gradle_flags=" >> "$GITHUB_OUTPUT"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "created_temp=true" >> "$GITHUB_OUTPUT"
            echo "gradle_flags=" >> "$GITHUB_OUTPUT"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > app/google-services.json
            echo "created_temp=true" >> "$GITHUB_OUTPUT"
            echo "gradle_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::app/google-services.json is missing and GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_JSON_BASE64 secret is not configured. Running Debug build with -PallowMissingGoogleServices=true."
            echo "created_temp=false" >> "$GITHUB_OUTPUT"
            echo "gradle_flags=-PallowMissingGoogleServices=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Google Services task
        run: gradle :app:processDebugGoogleServices ${{ steps.google_services.outputs.gradle_flags }}
      - name: Run tests and build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug ${{ steps.google_services.outputs.gradle_flags }}
      - name: Cleanup temporary Google Services file
        if: always() && steps.google_services.outputs.created_temp == 'true'
        run: rm -f app/google-services.json
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: edu-mini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
